<template>
    <div class="userDetailAndStatsWrapper">
        <lightning-layout multiple-rows>
            <lightning-layout-item size="12">
                <div>
                    <c-portfolio-user-details 
                    record-id={recordId} 
                    object-api-name={objectApiName}></c-portfolio-user-details>
                </div>
            </lightning-layout-item>
            <lightning-layout-item size="12">
                <div class="slds-m-top_medium">
                    <c-portfolio-user-stats rank={rank} points={points} badges={badges} trails={trails}></c-portfolio-user-stats>
                </div>
            </lightning-layout-item>
        </lightning-layout>
    </div>
</template>
