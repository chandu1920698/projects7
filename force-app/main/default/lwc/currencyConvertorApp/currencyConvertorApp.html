<template>
    <div class="currency-app">
        <div class="container">
            <div class="slds-card custom-card">
                <form action="" class="slds-var-p-around_large">
                    <img src={currencyImage} alt="Currency Image">
                    <h1 class="slds-text-heading_large slds-text-color_inverse slds-text-align_center slds-var-m-bottom_large">Currency Converter</h1>
                    <lightning-input type="number" name="amount" label="Amount" 
                        placeholder="Amount" variant="label-hidden" required class="slds-var-m-vertical_x-large"></lightning-input>
                    <div class="slds-grid slds-gutters baseline">
                        <div class="slds-col">
                            <lightning-combobox
                                name="CurrencyFrom"
                                label="From"
                                value={currencyFrom}
                                placeholder="Currency"
                                options={countryList}
                                variant="label-hidden"
                                onchange={handleChange} >
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-text-align_center">
                            <lightning-icon icon-name='action:change_record_type' alternative-text='change_record_type' size='x-small' title='change_record_type'></lightning-icon>
                        </div>
                        <div class="slds-col">
                            <lightning-combobox
                                name="CurrencyTo"
                                label="To"
                                value={currencyTo}
                                placeholder="Currency"
                                options={countryList}
                                variant="label-hidden"
                                onchange={handleChange} >
                            </lightning-combobox>
                        </div>
                    </div>
                    <button class="slds-button slds-button_stretch custom-button">Convert</button>
                </form>
            </div>
        </div>
    </div>
</template>
