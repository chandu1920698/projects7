<template>
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>

    <lightning-layout multiple-rows class="slds-m-around_medium">
        <template for:each={projectDetails} for:item="project">
            <lightning-layout-item key={project.projectName}>
                <div class="card">
                    <lightning-carousel class="custom-carousel">
                        <template for:each={project.imageUrls} for:item="imageUrl">
                            <lightning-carousel-image key={imageUrl}
                                src = {imageUrl}
                                href = "#"
                                alternative-text = "Image Text"
                                class="non-clickable"
                            >
                            </lightning-carousel-image>
                        </template>
                        
                    </lightning-carousel>
                    <div class="slds-button bottom slds-align_absolute-center">{project.projectName}
                        <span>
                            <a href={project.projectWebsite}>
                                <lightning-icon icon-name='utility:new_window' alternative-text='new_window' size='x-small' title='Open in new window' class="slds-p-left_x-small slds-p-bottom_x-small open-app"></lightning-icon>
                            </a>
                        </span>
                    </div>
                </div>
            </lightning-layout-item>
        </template>
        
    </lightning-layout>

    
</template>
