<template>
	<div class="app center">
		<div class="app-card">
			<header class="center">
                <template if:true={response}>
                    <img src={arrowBackIcon} alt="Back Arrow" onclick={handleBackArrowClick} class=" cursor slds-var-m-right_medium">
                </template>
				<h1>Weather App</h1>
			</header>
			<template if:true={loadingText}>
				<div class={loadingClass}>{loadingText}</div>
			</template>
			<template if:false={response}>
				<section class="slds-m-around_large">
					<form onsubmit={handleSubmit}>
						<input type="text" class="width100" placeholder="Enter City Name" required spellcheck="false"
                        onkeyup={handleSearch}/>
						<button type="Submit" class="slds-var-m-top_large width100">Search</button>
					</form>
				</section>
			</template>
			<template if:true={response}>
				<section class="slds-var-m-around_large text-center">
					<img src={weatherIcon} alt="Weather Icon" class="weather-img">
						<div class="temperature">
							<span>{response.temperature}</span>
							<span>°</span>C
                    
						</div>
						<div class="description">Clear sky</div>
						<div class="location">
							<img src={mapIcon} alt="Map Icon">
								<span>{response.location}</span>
							</div>
						</section>
						<footer>
							<div class="feels-like">
								<div>
									<img src={thermometerIcon} alt="Thermometer Icon">
										<div>{response.feels_like} °C</div>
									</div>
									<p>Feels like</p>
								</div>
								<div class="humidity">
									<div>
										<img src={dropletIcon} alt="Droplet Icon">
											<div>{response.humidity}</div>
										</div>
										<p>Humidity</p>
									</div>
								</footer>
							</template>
						</div>
					</div>
				</template>
