<template>

    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>

    <ul class="slds-timeline">
        <template for:each={workExperienceList} for:item="work">
            <li key={work.id} class="slds-m-around_small">
                <div class="slds-timeline__item_expandable slds-timeline__item_task slds-is-open">
                    <span class="slds-assistive-text">task</span>
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <button class="slds-button slds-button_icon" title={work.jobRole}>
                                <lightning-icon icon-name='utility:switch' alternative-text='switch' size='x-small' title='switch'></lightning-icon>
                                <span class="slds-assistive-text">Toggle details for Review proposals for EBC deck with larger team and have marketing review this</span>
                            </button>
                            <div class="slds-icon_container slds-icon-standard-task slds-timeline__icon" title="task">
                                <lightning-icon icon-name='standard:task' alternative-text='task' size='x-small' title='task'></lightning-icon>
                            </div>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-grid slds-grid_align-spread slds-timeline__trigger">
                                <div class="slds-grid slds-grid_vertical-align-center slds-truncate_container_75 slds-no-space">
                                    <h3 class="slds-truncate" title="Review proposals for EBC deck with larger team and have marketing review this">
                                        <strong>{work.jobCompnayName}</strong>
                                    </h3>
                                </div>
                                <div class="slds-timeline__actions slds-timeline__actions_inline">
                                    <p class="slds-timeline__date">{work.jobStartDate} -&nbsp;
                                        <template if:true={work.jobIsCurrent}>
                                            Current
                                        </template>
                                        <template if:false={work.jobIsCurrent}>
                                            {work.jobEndDate}
                                        </template>
                                    </p>
                                </div>
                            </div>
                            <p class="slds-m-horizontal_xx-small">
                                {work.jobWorkLocation}
                            </p>
                            <div class="slds-grid slds-m-top_x-small slds-m-horizontal_xx-small slds-theme_shade slds-box">
                                <c-portfolio-string-to-html
                                    content={work.jobDescription}
                                ></c-portfolio-string-to-html>
                            </div>
                        </div>
                    </div>
                </div>
            </li>
        </template>
        
    </ul>
</template>
