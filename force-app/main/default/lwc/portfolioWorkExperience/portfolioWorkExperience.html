<template>
    <template if:true={showSpinner}>
        <lightning-spinner alternative-text="Loading" class="spinner-center"></lightning-spinner>
    </template>
    <ul class="slds-timeline">
        <template for:each={workExperienceList} for:item="work">
            <li key={work.id} class="slds-m-around_small">
                <div class={work.dropdownClass}>
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <button class="slds-button slds-button_icon" data-id={work.id} title={work.jobRole} onclick={handleShowExperienceClick}>
                                <template if:true={work.isShowExperience}>
                                    <lightning-icon icon-name='utility:chevrondown' alternative-text='switch' size='x-small' title='Collapse'></lightning-icon>
                                </template>
                                <template if:false={work.isShowExperience}>
                                    <lightning-icon icon-name='utility:chevronright' alternative-text='switch' size='x-small' title='Expand'></lightning-icon>
                                </template>
                            </button>
                            <div class="slds-icon_container slds-icon-standard-task slds-timeline__icon" title="task">
                                <lightning-icon icon-name='standard:task' alternative-text='task' size='x-small' title='task'></lightning-icon>
                            </div>
                        </div>
                        <div class="slds-media__body non-clickable-class">
                            <template if:true={isDesktop}>
                                <div class="slds-grid slds-grid_align-spread slds-timeline__trigger">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-truncate_container_75 slds-no-space">
                                        <h2 class="slds-truncate" title={work.jobCompnayName}>
                                            <strong class="slds-text-heading_medium">{work.jobCompnayName}</strong>
                                        </h2>
                                    </div>
                                    <div class="slds-timeline__actions slds-timeline__actions_inline">
                                        <p class="slds-timeline__date">{work.jobStartDate} -&nbsp;
                                            <template if:true={work.jobIsCurrent}>
                                                Current
                                            </template>
                                            <template if:false={work.jobIsCurrent}>
                                                {work.jobEndDate}
                                            </template>
                                        </p>
                                    </div>
                                </div>

                                <template if:true={work.isShowExperience}>
                                    <div class="slds-grid">
                                        <div class="slds-col slds-m-left_small slds-truncate" title={work.jobRole}>
                                            <span class="slds-float_left role">{work.jobRole}</span>
                                        </div>
                                        <div class="slds-col slds-m-right_small slds-truncate" title={work.jobWorkLocation}>
                                            <span class="slds-float_right location">{work.jobWorkLocation}</span>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-m-top_x-small slds-m-horizontal_xx-small slds-theme_shade slds-box">
                                        <c-portfolio-string-to-html
                                            content={work.jobDescription}
                                        ></c-portfolio-string-to-html>
                                    </div>
                                </template>


                            </template>
                            <template if:false={isDesktop}>
                                <div class="slds-grid slds-grid_vertical">
                                    <div class="slds-col">
                                        <div class="slds-grid slds-grid_vertical-align-center slds-truncate_container_75 slds-no-space">
                                            <h2 class="slds-truncate" title={work.jobCompnayName}>
                                                <strong class="slds-text-heading_medium">{work.jobCompnayName}</strong>
                                            </h2>
                                        </div>
                                    </div>
                                    <div class="slds-col">
                                        <div class="slds-grid slds-grid_vertical">
                                            <div class="slds-col">
                                                <p class="role slds-truncate" title={work.jobRole}>{work.jobRole}</p>
                                            </div>
                                            <div class="slds-col">
                                                <p class="location slds-truncate" title={work.jobWorkLocation}>{work.jobWorkLocation}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <template if:true={work.isShowExperience}>
                                    <div class="slds-col">
                                        <div class="">
                                            <p class="">{work.jobStartDate} -&nbsp;
                                                <template if:true={work.jobIsCurrent}>
                                                    Current
                                                </template>
                                                <template if:false={work.jobIsCurrent}>
                                                    {work.jobEndDate}
                                                </template>
                                            </p>
                                        </div>
                                    </div>
                                        
                                    <div class="slds-grid slds-m-top_x-small slds-m-horizontal_xx-small slds-theme_shade slds-box">
                                        <c-portfolio-string-to-html
                                            content={work.jobDescription}
                                        ></c-portfolio-string-to-html>
                                    </div>
                                </template>
                            </template>

                        </div>
                    </div>
                </div>
            </li>
        </template>
        
    </ul>
</template>
