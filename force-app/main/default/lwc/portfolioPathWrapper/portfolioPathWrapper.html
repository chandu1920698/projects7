<template>
    <div class="show-tabs-on-desktop-view">
        <div class="portfolioWrapperClass">
            <div class="slds-path">
                <div class="slds-grid slds-path__track">
                    <div class="slds-grid slds-path__scroller-container">
                        <lightning-button-icon icon-name="utility:chevronleft" size="medium" alternative-text="Previous" class="slds-m-right_x-small" data-button-type="previous" onclick={handleNextPrevClick}></lightning-button-icon>
                        <div class="slds-path__scroller" role="application">
                            <div class="slds-path__scroller_inner">
                                <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal">
                                    <template if:true={sldsPathValues}>
                                        <template for:each={sldsPathValues} for:item="item">
                                            <li data-value={item.pItem.label} onclick={handleSelectPath} key={item.pathIndex} class={item.classList} role="presentation">
                                                <div class="slds-path__link" id={item.pItem.label}>
                                                    <span class="slds-path__title">{item.pItem.label}</span>
                                                </div>
                                            </li>
                                        </template>
                                    </template>
                                </ul>
                            </div>
                        </div>
                        <lightning-button-icon icon-name="utility:chevronright" size="medium" alternative-text="Next" class="slds-m-left_x-small" data-button-type="next" onclick={handleNextPrevClick}></lightning-button-icon>
                    </div>
                </div>
            </div>
        </div>

        <div class="slds-scrollable_y" style="height:50rem;width:auto">
            
            <template if:true={showSummary}>
                <template if:true={recordId}>
                    <c-portfolio-summary
                        record-id={recordId}
                        object-api-name={objectApiName}
                    ></c-portfolio-summary>
                </template>
            </template>

            <template if:true={showPersonalProjects}>
                <template if:true={recordId}>
                    <c-portfolio-personal-projects
                        record-id={recordId}
                        onshowcomponent={handleOnShowPersonalProjectsComponent}
                    ></c-portfolio-personal-projects>
                </template>
            </template>

            <template if:true={showWorkExperience}>
                <template if:true={recordId}>
                    <c-portfolio-work-experience
                        record-id={recordId}
                        is-education=false
                        onshowcomponent={handleOnShowWorkExperiencesComponent}
                    ></c-portfolio-work-experience>
                </template>
            </template>

                <template if:true={showSkills}>
                    <template if:true={recordId}>
                        <c-portfolio-skills
                            record-id={recordId}
                        ></c-portfolio-skills>
                    </template>
                </template>
                <template if:true={showEducation}>
                    <template if:true={recordId}>
                        <c-portfolio-work-experience
                            record-id={recordId}
                            is-education=true
                        ></c-portfolio-work-experience>
                    </template>
                </template>
                <template if:true={showCertifications}>
                    <template if:true={recordId}>
                        <c-portfolio-certifications 
                            record-id={recordId}
                            onshowcomponent={handleShowComponent}
                        ></c-portfolio-certifications>
                    </template>
                </template>
                <template if:true={showOthers}>
                    Others tab
                    <template if:true={recordId}>
        
                    </template>
                </template>
        </div>
    </div>
	
    <div class="accordion-wrapper show-accordion-on-mobile-view">
        <lightning-accordion allow-multiple-sections-open>
            <lightning-accordion-section name="Summary" label="Summary">
                <template if:true={recordId}>
                    <div class="slds-var-m-left_medium">
                        <c-portfolio-summary
                            record-id={recordId}
                            object-api-name={objectApiName}
                        ></c-portfolio-summary>
                    </div>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Personal Projects" label="Personal Projects">
                <template if:true={recordId}>
                    <div class="slds-var-m-left_medium">
                        <c-portfolio-personal-projects
                            record-id={recordId}
                        ></c-portfolio-personal-projects>
                    </div>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Work Experience" label="Work Experience">
                <template if:true={recordId}>
                    <div class="slds-var-m-left_medium">
                        <c-portfolio-work-experience
                            record-id={recordId}
                            is-education=false
                        ></c-portfolio-work-experience>
                    </div>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Skills" label="Skills">
                <template if:true={recordId}>
                    <div class="slds-var-m-left_medium">
                        <c-portfolio-skills
                            record-id={recordId}
                        ></c-portfolio-skills>
                    </div>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Education" label="Education">
                <template if:true={recordId}>
                    <div class="slds-var-m-left_medium">
                        <c-portfolio-work-experience
                            record-id={recordId}
                            is-education=true
                        ></c-portfolio-work-experience>
                    </div>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Certifications" label="Certifications">
                <template if:true={recordId}>
                    <div class="slds-var-m-left_medium">
                        <c-portfolio-certifications 
                            record-id={recordId}
                        ></c-portfolio-certifications>
                    </div>
                </template>
            </lightning-accordion-section>
        </lightning-accordion>

    </div>
    
</template>
