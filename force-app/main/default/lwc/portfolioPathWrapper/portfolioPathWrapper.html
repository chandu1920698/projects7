<template>
    <div class="show-tabs-on-desktop-view">
        <div class="portfolioWrapperClass">
            <div class="slds-path">
                <div class="slds-grid slds-path__track">
                    <div class="slds-grid slds-path__scroller-container">
                        <lightning-button-icon icon-name="utility:chevronleft" size="medium" alternative-text="Previous" class="slds-m-right_x-small" data-button-type="previous" onclick={handleNextPrevClick}></lightning-button-icon>
                        <div class="slds-path__scroller" role="application">
                            <div class="slds-path__scroller_inner">
                                <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal">
                                    <template if:true={sldsPathValues}>
                                        <template for:each={sldsPathValues} for:item="item">
                                            <li data-value={item.pItem.label} onclick={handleSelectPath} key={item.pathIndex} class={item.classList} role="presentation">
                                                <div class="slds-path__link" id={item.pItem.label}>
                                                    <span class="slds-path__title path-cusrsor">{item.pItem.label}</span>
                                                </div>
                                            </li>
                                        </template>
                                    </template>
                                </ul>
                            </div>
                        </div>
                        <lightning-button-icon icon-name="utility:chevronright" size="medium" alternative-text="Next" class="slds-m-left_x-small" data-button-type="next" onclick={handleNextPrevClick}></lightning-button-icon>
                    </div>
                </div>
            </div>
        </div>

        <div class="slds-scrollable_y" style="min-height:40rem;width:auto">
            
            <template lwc:if={showSummary}>
                <template lwc:if={recordId}>
                    <c-portfolio-summary
                        record-id={recordId}
                        object-api-name={objectApiName}
                    ></c-portfolio-summary>
                </template>
            </template>
            <template lwc:if={showPersonalProjects}>
                <template lwc:if={recordId}>
                    <c-portfolio-personal-projects
                        record-id={recordId}
                    ></c-portfolio-personal-projects>
                </template>
            </template>
            <template lwc:if={showWorkExperience}>
                <template lwc:if={recordId}>
                    <c-portfolio-work-experience
                        record-id={recordId}
                        is-education=false
                    ></c-portfolio-work-experience>
                </template>
            </template>
            <template lwc:if={showSkills}>
                <template lwc:if={recordId}>
                    <c-portfolio-skills
                        record-id={recordId}
                    ></c-portfolio-skills>
                </template>
            </template>
            <template lwc:if={showEducation}>
                <template lwc:if={recordId}>
                    <c-portfolio-work-experience
                        record-id={recordId}
                        is-education=true
                    ></c-portfolio-work-experience>
                </template>
            </template>
            <template lwc:if={showCertifications}>
                <template lwc:if={recordId}>
                    <c-portfolio-certifications 
                        record-id={recordId}
                    ></c-portfolio-certifications>
                </template>
            </template>
            <template lwc:if={showContactMe}>
                <template lwc:if={recordId}>
                    <c-portfolio-contact-me
                            record-id={recordId}>
                    </c-portfolio-contact-me>
                </template>
            </template>
        </div>
    </div>
	
    <div class="accordion-wrapper show-accordion-on-mobile-view">
        <lightning-accordion>
            <lightning-accordion-section name="About Me" label="About Me" onclick={handleMobileAccordiantabClick} class="About Me" index="0">
                <template lwc:if={showSummary}>
                    <template if:true={recordId}>
                        <div class="slds-var-m-left_medium">
                            <c-portfolio-summary
                                record-id={recordId}
                                object-api-name={objectApiName}
                            ></c-portfolio-summary>
                        </div>
                    </template>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Personal Projects" label="Personal Projects" onclick={handleMobileAccordiantabClick} class="Personal-Projects" index="1">
                <template lwc:if={showPersonalProjects}>
                    <template if:true={recordId}>
                        <div class="slds-var-m-left_medium">
                            <c-portfolio-personal-projects
                                record-id={recordId}
                            ></c-portfolio-personal-projects>
                        </div>
                    </template>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Work Experience" label="Work Experience" onclick={handleMobileAccordiantabClick} class="Work-Experience" index="2">
                <template lwc:if={showWorkExperience}>
                    <template if:true={recordId}>
                        <div class="slds-var-m-left_medium">
                            <c-portfolio-work-experience
                                record-id={recordId}
                                is-education=false
                            ></c-portfolio-work-experience>
                        </div>
                    </template>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Skills" label="Skills" onclick={handleMobileAccordiantabClick} class="Skills" index="3">
                <template lwc:if={showSkills}>
                    <template if:true={recordId}>
                        <div class="slds-var-m-left_medium">
                            <c-portfolio-skills
                                record-id={recordId}
                            ></c-portfolio-skills>
                        </div>
                    </template>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Education" label="Education" onclick={handleMobileAccordiantabClick} class="Education" index="4">
                <template lwc:if={showEducation}>
                    <template if:true={recordId}>
                        <div class="slds-var-m-left_medium">
                            <c-portfolio-work-experience
                                record-id={recordId}
                                is-education=true
                            ></c-portfolio-work-experience>
                        </div>
                    </template>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Certifications" label="Certifications" onclick={handleMobileAccordiantabClick} class="Certifications" index="5">
                <template lwc:if={showCertifications}>
                    <template if:true={recordId}>
                        <div class="slds-var-m-left_medium">
                            <c-portfolio-certifications 
                                record-id={recordId}
                            ></c-portfolio-certifications>
                        </div>
                    </template>
                </template>
            </lightning-accordion-section>
            <lightning-accordion-section name="Contact Me" label="Contact Me" onclick={handleMobileAccordiantabClick} class="contact-me" index="6">
                <template lwc:if={showContactMe}>
                    <template if:true={recordId}>
                        <div class="slds-var-m-left_medium">
                            <c-portfolio-contact-me
                                record-id={recordId}
                            ></c-portfolio-contact-me>
                        </div>
                    </template>
                </template>
            </lightning-accordion-section>
        </lightning-accordion>
    </div>
</template>
